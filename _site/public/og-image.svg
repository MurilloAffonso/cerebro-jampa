<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#092238"/>
      <stop offset="100%" stop-color="#163149"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#107997"/>
      <stop offset="100%" stop-color="#0E6B85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative wave shape bottom -->
  <ellipse cx="600" cy="750" rx="900" ry="300" fill="#051727" opacity="0.4"/>

  <!-- Orange accent bar left -->
  <rect x="80" y="80" width="6" height="470" rx="3" fill="url(#accent)"/>

  <!-- Logo mark -->
  <circle cx="130" cy="120" r="40" fill="#107997"/>
  <text x="130" y="128" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">VP</text>

  <!-- Brand name -->
  <text x="190" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">Vem Passear em Jampa</text>
  <text x="190" y="142" font-family="Arial, sans-serif" font-size="18" fill="#93C5FD">vempassearjampa.com.br</text>

  <!-- Main headline -->
  <text x="110" y="250" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="white">Passeios em</text>
  <text x="110" y="320" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#C5B7A3">João Pessoa</text>

  <!-- Subtitle -->
  <text x="110" y="385" font-family="Arial, sans-serif" font-size="26" fill="#BFDBFE">Praias · Piscinas Naturais · City Tour · Transfer</text>
  <text x="110" y="420" font-family="Arial, sans-serif" font-size="24" fill="#93C5FD">Atendimento pelo WhatsApp · Guia credenciado</text>

  <!-- Divider -->
  <rect x="110" y="455" width="980" height="1" fill="#FFFFFF" opacity="0.15"/>

  <!-- Trust badges -->
  <!-- Rating -->
  <text x="110" y="500" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FBBF24">★ 4.9</text>
  <text x="110" y="528" font-family="Arial, sans-serif" font-size="16" fill="#93C5FD">61 avaliações no Google</text>

  <!-- Cadastur -->
  <rect x="350" y="470" width="2" height="70" fill="#FFFFFF" opacity="0.2"/>
  <text x="380" y="500" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Cadastur</text>
  <text x="380" y="525" font-family="Arial, sans-serif" font-size="16" fill="#93C5FD">52.077.577 · Ativo</text>

  <!-- WhatsApp -->
  <rect x="600" y="470" width="2" height="70" fill="#FFFFFF" opacity="0.2"/>
  <text x="630" y="500" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4ADE80">💬 WhatsApp</text>
  <text x="630" y="525" font-family="Arial, sans-serif" font-size="16" fill="#93C5FD">+55 83 9908-7830</text>
</svg>
