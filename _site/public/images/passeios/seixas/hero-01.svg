<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8E3"/>
      <stop offset="55%" stop-color="#4AADCC"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E86AB"/>
      <stop offset="100%" stop-color="#1A5276"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Céu -->
  <rect width="1200" height="280" fill="url(#sky)"/>

  <!-- Mar -->
  <rect y="280" width="1200" height="220" fill="url(#sea)"/>

  <!-- Ondas suaves -->
  <path d="M0 295 Q150 280 300 295 Q450 310 600 295 Q750 280 900 295 Q1050 310 1200 295 L1200 310 Q1050 325 900 310 Q750 295 600 310 Q450 325 300 310 Q150 295 0 310 Z" fill="#1F6F8B" opacity="0.5"/>
  <path d="M0 330 Q200 315 400 330 Q600 345 800 330 Q1000 315 1200 330 L1200 345 Q1000 360 800 345 Q600 330 400 345 Q200 360 0 345 Z" fill="#1A5276" opacity="0.4"/>

  <!-- Coral / Fundo do mar sugerido -->
  <ellipse cx="200" cy="430" rx="80" ry="25" fill="#1A6882" opacity="0.5"/>
  <ellipse cx="600" cy="450" rx="120" ry="20" fill="#145374" opacity="0.4"/>
  <ellipse cx="1000" cy="420" rx="90" ry="22" fill="#1A6882" opacity="0.5"/>

  <!-- Overlay escuro (simula overlay do hero real) -->
  <rect width="1200" height="500" fill="url(#overlay)"/>

  <!-- Texto principal -->
  <text x="600" y="320" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0.9">Piscinas Naturais do Seixas — João Pessoa</text>

  <!-- Texto secundário -->
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" opacity="0.7">hero-01.svg · placeholder temporário · substituir por foto real</text>

  <!-- Badge de placeholder -->
  <rect x="20" y="20" width="260" height="36" rx="4" fill="#107997" opacity="0.85"/>
  <text x="150" y="43" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PLACEHOLDER — Hero Seixas</text>

  <!-- Dimensão sugerida -->
  <text x="1180" y="490" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="end" opacity="0.5">1200 × 500px</text>
</svg>
