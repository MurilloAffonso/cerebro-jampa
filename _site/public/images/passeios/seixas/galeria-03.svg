<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="catamara" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="45%" stop-color="#4AADCC"/>
      <stop offset="100%" stop-color="#1A5276"/>
    </linearGradient>
  </defs>

  <!-- Céu + mar -->
  <rect width="600" height="400" fill="url(#catamara)"/>

  <!-- Horizonte -->
  <rect y="210" width="600" height="190" fill="#2E86AB"/>

  <!-- Catamarã sugerido (forma simples) -->
  <rect x="170" y="155" width="260" height="65" rx="6" fill="#FFFFFF" opacity="0.9"/>
  <rect x="190" y="130" width="220" height="30" rx="4" fill="#EEEEEE" opacity="0.8"/>
  <polygon points="300,90 260,130 340,130" fill="#FF6B35" opacity="0.75"/>
  <rect x="160" y="215" width="280" height="18" rx="3" fill="#004E89" opacity="0.7"/>

  <!-- Ondas -->
  <path d="M0 240 Q100 228 200 240 Q300 252 400 240 Q500 228 600 240" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  <path d="M0 265 Q150 253 300 265 Q450 277 600 265" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2"/>

  <!-- Texto -->
  <rect x="0" y="310" width="600" height="90" fill="#000000" opacity="0.45"/>
  <text x="300" y="348" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Catamarã saindo de Tambaú</text>
  <text x="300" y="376" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.75">galeria-03.svg · placeholder temporário</text>

  <!-- Badge -->
  <rect x="12" y="12" width="100" height="26" rx="3" fill="#FF6B35" opacity="0.85"/>
  <text x="62" y="29" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GALERIA 03</text>
</svg>
