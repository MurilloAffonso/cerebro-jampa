<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3BBFE8"/>
      <stop offset="70%" stop-color="#1A7FA8"/>
      <stop offset="100%" stop-color="#0D4F6B"/>
    </linearGradient>
  </defs>

  <!-- Fundo água profunda -->
  <rect width="600" height="400" fill="url(#coral)"/>

  <!-- Fundo arenoso -->
  <ellipse cx="300" cy="400" rx="340" ry="60" fill="#B8860B" opacity="0.25"/>

  <!-- Corais sugeridos (formas orgânicas simples) -->
  <ellipse cx="80" cy="360" rx="35" ry="50" fill="#E74C3C" opacity="0.4"/>
  <ellipse cx="80" cy="320" rx="20" ry="30" fill="#E74C3C" opacity="0.3"/>
  <ellipse cx="200" cy="370" rx="28" ry="40" fill="#8E44AD" opacity="0.35"/>
  <ellipse cx="250" cy="345" rx="18" ry="28" fill="#8E44AD" opacity="0.3"/>
  <ellipse cx="420" cy="365" rx="32" ry="45" fill="#107997" opacity="0.35"/>
  <ellipse cx="530" cy="355" rx="25" ry="38" fill="#E67E22" opacity="0.3"/>

  <!-- Raios de luz -->
  <line x1="200" y1="0" x2="140" y2="300" stroke="#FFFFFF" stroke-width="20" opacity="0.05"/>
  <line x1="400" y1="0" x2="360" y2="300" stroke="#FFFFFF" stroke-width="16" opacity="0.05"/>
  <line x1="550" y1="0" x2="530" y2="280" stroke="#FFFFFF" stroke-width="12" opacity="0.04"/>

  <!-- Texto -->
  <rect x="0" y="310" width="600" height="90" fill="#000000" opacity="0.5"/>
  <text x="300" y="348" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Corais das Piscinas Naturais</text>
  <text x="300" y="376" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.75">galeria-04.svg · placeholder temporário</text>

  <!-- Badge -->
  <rect x="12" y="12" width="100" height="26" rx="3" fill="#107997" opacity="0.85"/>
  <text x="62" y="29" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GALERIA 04</text>
</svg>
