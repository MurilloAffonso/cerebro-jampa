<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="praia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="40%" stop-color="#5BB8D4"/>
      <stop offset="70%" stop-color="#2E86AB"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
  </defs>

  <!-- Fundo praia + mar -->
  <rect width="600" height="400" fill="url(#praia)"/>

  <!-- Areia -->
  <rect y="310" width="600" height="90" fill="#C9A96E" opacity="0.75"/>
  <ellipse cx="300" cy="310" rx="320" ry="22" fill="#D4AC72" opacity="0.6"/>

  <!-- Ondas na areia -->
  <path d="M0 295 Q100 283 200 295 Q300 307 400 295 Q500 283 600 295" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4"/>
  <path d="M0 318 Q150 308 300 318 Q450 328 600 318" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>

  <!-- Pessoas sugeridas na beira da água (formas simples) -->
  <ellipse cx="220" cy="298" rx="8" ry="14" fill="#092238" opacity="0.5"/>
  <ellipse cx="340" cy="295" rx="7" ry="13" fill="#107997" opacity="0.5"/>
  <ellipse cx="400" cy="300" rx="8" ry="12" fill="#092238" opacity="0.45"/>

  <!-- Texto -->
  <rect x="0" y="310" width="600" height="90" fill="#000000" opacity="0.4"/>
  <text x="300" y="348" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Praia de Tambaú — embarque</text>
  <text x="300" y="376" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.75">galeria-05.svg · placeholder temporário</text>

  <!-- Badge -->
  <rect x="12" y="12" width="100" height="26" rx="3" fill="#107997" opacity="0.85"/>
  <text x="62" y="29" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GALERIA 05</text>
