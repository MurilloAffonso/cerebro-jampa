<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="nascer" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="35%" stop-color="#FFB347"/>
      <stop offset="65%" stop-color="#4AADCC"/>
      <stop offset="100%" stop-color="#1A5276"/>
    </linearGradient>
    <radialGradient id="sol" cx="20%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo nascer do sol / ponto mais oriental -->
  <rect width="600" height="400" fill="url(#nascer)"/>

  <!-- Reflexo solar na água -->
  <rect y="220" width="600" height="180" fill="#1A5276"/>
  <ellipse cx="120" cy="260" rx="100" ry="18" fill="#FFD700" opacity="0.15"/>

  <!-- Sol sugerido -->
  <circle cx="120" cy="130" r="45" fill="url(#sol)"/>
  <circle cx="120" cy="130" r="28" fill="#FFD700" opacity="0.6"/>

  <!-- Horizonte / falésia sugerida -->
  <path d="M400 180 Q450 160 500 175 Q550 190 600 170 L600 220 L400 220 Z" fill="#2C3E50" opacity="0.5"/>

  <!-- Ondas -->
  <path d="M0 240 Q100 228 200 240 Q300 252 400 240 Q500 228 600 240" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.2"/>

  <!-- Texto -->
  <rect x="0" y="310" width="600" height="90" fill="#000000" opacity="0.45"/>
  <text x="300" y="345" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ponto mais oriental das Américas</text>
  <text x="300" y="368" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.75">Seixas — João Pessoa, PB</text>
  <text x="300" y="388" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" opacity="0.55">galeria-06.svg · placeholder temporário</text>

  <!-- Badge -->
  <rect x="12" y="12" width="100" height="26" rx="3" fill="#FF6B35" opacity="0.85"/>
  <text x="62" y="29" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GALERIA 06</text>
</svg>
