<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="mar" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>

  <!-- Fundo mar -->
  <rect width="600" height="400" fill="url(#mar)"/>

  <!-- Areia sugerida na base -->
  <rect y="330" width="600" height="70" fill="#C9A96E" opacity="0.45"/>
  <ellipse cx="300" cy="330" rx="320" ry="20" fill="#C9A96E" opacity="0.3"/>

  <!-- Peixes sugeridos (formas simples) -->
  <ellipse cx="180" cy="200" rx="22" ry="10" fill="#FFFFFF" opacity="0.15" transform="rotate(-10 180 200)"/>
  <ellipse cx="380" cy="160" rx="18" ry="8" fill="#FFFFFF" opacity="0.12" transform="rotate(5 380 160)"/>
  <ellipse cx="500" cy="250" rx="20" ry="9" fill="#FFFFFF" opacity="0.13" transform="rotate(-5 500 250)"/>

  <!-- Raios de luz na água -->
  <line x1="150" y1="0" x2="100" y2="280" stroke="#FFFFFF" stroke-width="18" opacity="0.04"/>
  <line x1="350" y1="0" x2="320" y2="280" stroke="#FFFFFF" stroke-width="14" opacity="0.04"/>

  <!-- Texto -->
  <rect x="0" y="310" width="600" height="90" fill="#000000" opacity="0.45"/>
  <text x="300" y="348" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Snorkel em Seixas</text>
  <text x="300" y="376" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.75">galeria-02.svg · placeholder temporário</text>

  <!-- Badge -->
  <rect x="12" y="12" width="100" height="26" rx="3" fill="#FF6B35" opacity="0.85"/>
  <text x="62" y="29" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GALERIA 02</text>
</svg>
