const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

// ─── useTweaks ────────────────────────────────────────────────────────────
function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return { tweaks: values, setTweak };
}

// ─── TweaksPanel ─────────────────────────────────────────────────────────
const TWEAK_CSS = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:9999;width:272px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.88);color:#29261b;-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:.5px solid rgba(255,255,255,.7);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none;border-bottom:.5px solid rgba(0,0,0,.07)}

  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.5);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:14px;line-height:22px;text-align:center}

  .twk-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  .twk-sect{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(41,38,27,.4);padding-top:4px}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-lbl{font-size:11.5px;font-weight:500;color:rgba(41,38,27,.7)}
  .twk-seg{display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.07);user-select:none;position:relative}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.14);transition:left .18s,width .18s;pointer-events:none}
  .twk-seg button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;font-size:11px;min-height:24px;border-radius:6px;cursor:pointer;padding:3px 6px;line-height:1.2}
  select.twk-field{appearance:none;width:100%;height:28px;padding:0 28px 0 9px;border:.5px solid rgba(0,0,0,.12);border-radius:7px;background:rgba(255,255,255,.7) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path fill='rgba(0,0,0,.4)' d='M0 0h10L5 6z'/></svg>") no-repeat right 9px center;color:inherit;font:inherit;cursor:pointer;outline:none}
`;

function TweaksPanel({ children }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const onMsg = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  if (!open) return null;
  return (
    <>
      <style>{TWEAK_CSS}</style>
      <div ref={ref} className="twk-panel" data-noncommentable="">
        <div className="twk-hd">
          <b>Tweaks</b>
          <button className="twk-x" onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ title }) {
  return <div className="twk-sect">{title}</div>;
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === 'string' ? { label: o, value: o } : o);
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl">{label}</div>
      <div className="twk-seg">
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map(o => (
          <button key={o.value} onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl">{label}</div>
      <select className="twk-field" value={value} onChange={e => onChange(e.target.value)}>
        {options.map(o => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </div>
  );
}

    <>
      <Header />
      <div style={{ paddingTop: 64 }}>
        <div className="fade-up d1"><HeroSection variant={heroVariant} heroBg={heroBg} /></div>
        <div className="fade-up d2"><CategoriasSection layout={layoutCards} /></div>
        <div className="fade-up d3"><PasseiosSection /></div>
        <div className="fade-up d4"><MurilloSection /></div>
        <div className="fade-up d5"><CTAFinal ctaVariant={ctaVariant} /></div>
        <Footer />
      </div>

      <TweaksPanel>
        <TweakSection title="Hero" />
        <TweakRadio label="Variação" value={heroVariant}
          options={[{ label: 'A — Sem foto', value: 'A' }, { label: 'B — Com foto', value: 'B' }]}
          onChange={v => setTweak('heroVariant', v)} />
        {heroVariant === 'A' && (
          <TweakSelect label="Fundo do Hero" value={heroBg}
            options={[
              { label: 'Azul profundo', value: 'mesh-azul' },
              { label: 'Coral / laranja', value: 'mesh-coral' },
              { label: 'Verde / teal', value: 'mesh-verde' },
              { label: 'Escuro puro', value: 'escuro-puro' },
            ]}
            onChange={v => setTweak('heroBg', v)} />
        )}
        <TweakSection title="CTA Final" />
        <TweakRadio label="Cor de fundo" value={ctaVariant}
          options={[{ label: 'Laranja', value: 'laranja' }, { label: 'Azul escuro', value: 'azul' }]}
          onChange={v => setTweak('ctaVariant', v)} />
        <TweakSection title="Categorias" />
        <TweakRadio label="Layout dos cards" value={layoutCards}
          options={[{ label: 'Grid', value: 'grid' }, { label: 'Lista', value: 'lista' }]}
          onChange={v => setTweak('layoutCards', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
